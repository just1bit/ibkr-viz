name: Build and deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- frontend ----------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          # dist/ is gitignored — verify it exists
          test -f frontend/dist/index.html || (echo "Frontend build failed" && exit 1)

      # ---- artifact ----------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            backend/
            frontend/dist/
            requirements.txt
            .gitignore

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F7789AF204A4932819F542AAC163C4F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06C46F231B97443ABD60A2E5957EED3B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_98DE88682BE5425ABB9A64601196B9B3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ibkr-viz
          slot-name: Production
          package: .
