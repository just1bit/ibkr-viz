# =============================================================================
# IBKR Portfolio Viz — Config Template
# Copy to config.local.yaml and fill in your values.
# config.local.yaml is git-ignored.
# =============================================================================

# --- Google OAuth (required) --------------------------------------------------
# Create OAuth 2.0 Web Application at https://console.cloud.google.com
# Add {base_url}/auth/callback as authorized redirect URI.
google_client_id: ""
google_client_secret: ""
base_url: "http://localhost:5123"

# --- Session & Encryption (required) ------------------------------------------
# Generate: python -c "import secrets; print(secrets.token_hex(32))"
secret_key: ""
# Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
flex_encryption_key: ""

# --- Database (required) ------------------------------------------------------
# PostgreSQL only. Run backend/schema.sql to create tables first.
postgres_url: "postgresql://user:pass@host:5432/dbname"

# --- IBKR Flex ----------------------------------------------------------------
flex_max_wait: 30          # seconds, max wait for IBKR Flex response

# --- S3 Storage (optional) ----------------------------------------------------
# Leave s3_bucket empty to skip S3. Raw XML is archived per report date.
# Compatible with AWS S3, Cloudflare R2, MinIO.
s3_bucket: ""
s3_endpoint: ""
s3_region: "auto"
s3_access_key: ""
s3_secret_key: ""
s3_prefix: "flex_raw/"

# --- Refresh Scheduling -------------------------------------------------------
market_timezone: "America/New_York"
report_ready_hour: 1       # hour in market TZ when IBKR report is expected
fetch_retry_backoff: 3600  # seconds between retries when report is missing
refresh_cooldown: 600      # seconds between manual refresh clicks per user
scheduler_max_workers: 8   # max concurrent users during hourly refresh

# --- Admin (optional) ---------------------------------------------------------
# Google account emails listed here get admin privileges on next login.
admin_emails: []

# --- Server -------------------------------------------------------------------
port: 5123
debug: true
